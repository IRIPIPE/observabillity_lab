global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: task-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
